<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Hello! My name is Kier Omner Esmundo. This is a multi-page website project about a white water rafting company. This is the contact us page.">
    <meta name="author" content="Kier Omner Esmundo">
    <title>Contact Us | Rafting Travel</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <!-- update the css , you are required to use to same css, so you can just modify the section, class, id names-->
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="Rafting Travel Logo">
        <div id="logo">Rafting Travel</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact">
            <h1>Rafting Travel</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@raftingtravel.com</p>
            <!-- contact information here DONE just edit the css code-->
        </section>
        <div class="contact-container">
            <div class="maps">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3768.148037061157!2d-113.1564621016006!3d37.42240431257853!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sKolob%20Canyons!5e0!3m2!1sen!2sph!4v1786524934943!5m2!1sen!2sph"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
                <!-- google maps here DONE-->
            </div>
            <div class="form">
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email">

                    <fieldset>
                        <legend id="legend">Message Purpose</legend>

                        <label class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"></textarea>

                    <label class="subs"><input type="checkbox" id="subscribe"
                          name="subscribe">Please subscribe me to the monthly newsletter</label>
                    <div class="form-buttons">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
                <!-- name, email, and stuff DONE-->
                <!-- application of the new lesson DONE-->
            </div>
        </div>
        <section id="serve-section">
            <h2>We Are Here To Serve You</h2>
            <figure class="employee">
                <!-- change the sample images DONE -->
                <img src="images/employee1.jpg" alt="Employee Profile">
                <figcaption>Manager</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee2.jpg" alt="Employee Profile">
                <figcaption>Help Desk</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee3.jpg" alt="Employee Profile">
                <figcaption>Tour Guide</figcaption>
            </figure>
        </section>
    </main>
    <footer id="footer-layout">
        <p id="footer-text">&copy; 2026 Rafting Travel | Kier Omner Esmundo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-icon.png" alt="Facebook icon"></a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.png" alt="LinkedIn icon"></a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.png" alt="Instagram icon"></a>
        </nav>
    </footer>
    <!-- footer is already looking good -->
</body>
<!-- add border to the header and footer -->

</html>
